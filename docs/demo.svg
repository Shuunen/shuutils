<svg xmlns="http://www.w3.org/2000/svg" aria-label="Shuutils demo" viewBox="0 0 1200 630"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs><path fill="url(#a)" d="M0 0h1200v630H0z"/><g font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"><rect width="84" height="84" x="70" y="80" fill="#020617" rx="20"/><path fill="#facc15" d="m118 92-24 38h16l-7 26 29-42h-17Z"/><text x="70" y="250" fill="#f8fafc" font-size="84" font-weight="700">shuu<tspan fill="#facc15">tils</tspan></text><text x="72" y="300" fill="#94a3b8" font-size="26">mostly pure JS utils</text><g fill="#e2e8f0" font-size="20" text-anchor="middle"><rect width="120" height="42" x="70" y="350" fill="#334155" rx="21"/><text x="130" y="378">0 deps</text><rect width="100" height="42" x="204" y="350" fill="#334155" rx="21"/><text x="254" y="378">ESM</text><rect width="150" height="42" x="318" y="350" fill="#334155" rx="21"/><text x="393" y="378">TypeScript</text></g><rect width="438" height="64" x="70" y="440" fill="#020617" stroke="#334155" rx="12"/><text x="96" y="481" fill="#94a3b8" font-size="24">$ <tspan fill="#f8fafc">npm install shuutils</tspan></text><rect width="560" height="470" x="570" y="80" fill="#020617" stroke="#334155" rx="18"/><circle cx="604" cy="112" r="7" fill="#ef4444"/><circle cx="628" cy="112" r="7" fill="#eab308"/><circle cx="652" cy="112" r="7" fill="#22c55e"/><g font-size="18"><text x="600" y="176" fill="#f8fafc"><tspan fill="#c084fc">import</tspan> { slugify, parseJson } <tspan fill="#c084fc">from</tspan> <tspan fill="#86efac">&apos;shuutils&apos;</tspan></text><text x="600" y="236" fill="#f8fafc">slugify(<tspan fill="#86efac">&apos;example.com&apos;</tspan>)</text><text x="600" y="268" fill="#64748b">// &apos;example-com&apos;</text><text x="600" y="328" fill="#f8fafc"><tspan fill="#c084fc">const</tspan> result = parseJson(<tspan fill="#86efac">&apos;{&quot;a&quot;:1}&apos;</tspan>)</text><text x="600" y="360" fill="#f8fafc"><tspan fill="#c084fc">if</tspan> (result.ok) result.value</text><text x="600" y="392" fill="#64748b">// { a: 1 }</text><text x="600" y="452" fill="#f8fafc"><tspan fill="#c084fc">import</tspan> { uniqueMark } <tspan fill="#c084fc">from</tspan> <tspan fill="#86efac">&apos;shuutils/plugins&apos;</tspan></text><text x="600" y="484" fill="#64748b">// 4.2.0 - 123abc45 - 01/01/2021 12:00:00</text></g></g></svg>
